env:
  STARTUP: --max_idle_secs=0
  COMMON: -c opt --stamp=no --curses=yes --symlink_prefix=/ --config=running_in_ci --repository_cache=~/.cache/bazel_repository --experimental_repository_cache_hardlinks=true --google_default_credentials --remote_cache=https://storage.googleapis.com/austin-vpn-bazel-cache --nobuild_runfile_links
  TARGETS: //... @com_google_absl//... @ceres-solver//... @rawrtc//... @com_google_googletest//... @symengine//... @gmp//...
  ROBORIO_TARGETS: ${TARGETS}

steps:
  - label: "lint"
    commands:
      - tools/bazel shutdown; tools/bazel ${STARTUP} --output_base=../k8_output_base run ${COMMON} --remote_download_outputs=toplevel //tools/lint:run-ci --enable_bzlmod --noenable_workspace
    retry:
      automatic:
        - exit_status: -1  # Connection to the Agent was lost
          signal_reason: none
          limit: 2
        - signal_reason: agent_stop  # Agent was stopped by the OS (e.g. spot termination)
          limit: 2

  - label: "x86_64"
    commands:
      - tools/bazel shutdown; tools/bazel ${STARTUP} --output_base=../k8_output_base test ${COMMON} --config=eigen ${TARGETS} --remote_download_outputs=minimal --noenable_bzlmod --enable_workspace -- -@ceres-solver//:polynomial_test -@com_google_absl//absl/numeric:bits_test -//aos/ipc_lib:lockless_queue_wrap_test_atomic_times -//aos/ipc_lib:lockless_queue_wrap_test_no_atomic_times
    retry:
      automatic:
        - exit_status: -1  # Connection to the Agent was lost
          signal_reason: none
          limit: 2
        - signal_reason: agent_stop  # Agent was stopped by the OS (e.g. spot termination)
          limit: 2

  - label: "x86_64 bzlmod"
    commands:
      - tools/bazel shutdown; tools/bazel ${STARTUP} --output_base=../k8_output_base test ${COMMON} --config=eigen ${TARGETS} --remote_download_outputs=minimal --enable_bzlmod --noenable_workspace --lockfile_mode=error -- -@ceres-solver//:polynomial_test -@com_google_absl//absl/numeric:bits_test
    retry:
      automatic:
        - exit_status: -1  # Connection to the Agent was lost
          signal_reason: none
          limit: 2
        - signal_reason: agent_stop  # Agent was stopped by the OS (e.g. spot termination)
          limit: 2

  - label: "x86_64 bzlmod Python 3.10"
    commands:
      - tools/bazel shutdown; tools/bazel ${STARTUP} --output_base=../k8_output_base test ${COMMON} --config=eigen --@rules_python//python/config_settings:python_version=3.10 ${TARGETS} --remote_download_outputs=minimal --enable_bzlmod --noenable_workspace --lockfile_mode=error -- -@ceres-solver//:polynomial_test -@com_google_absl//absl/numeric:bits_test -//aos/ipc_lib:lockless_queue_wrap_test_atomic_times -//aos/ipc_lib:lockless_queue_wrap_test_no_atomic_times
    retry:
      automatic:
        - exit_status: -1  # Connection to the Agent was lost
          signal_reason: none
          limit: 2
        - signal_reason: agent_stop  # Agent was stopped by the OS (e.g. spot termination)
          limit: 2

  - label: "arm64"
    commands:
      - tools/bazel shutdown; tools/bazel ${STARTUP} --output_base=../common_output_base build ${COMMON} --remote_download_outputs=minimal --config=arm64 ${TARGETS} --noenable_bzlmod --enable_workspace -- -@com_google_absl//absl/numeric:bits_test
    retry:
      automatic:
        - exit_status: -1  # Connection to the Agent was lost
          signal_reason: none
          limit: 2
        - signal_reason: agent_stop  # Agent was stopped by the OS (e.g. spot termination)
          limit: 2

  - label: "arm64 bzlmod"
    commands:
      - tools/bazel shutdown; tools/bazel ${STARTUP} --output_base=../common_output_base build ${COMMON} --remote_download_outputs=minimal --config=arm64 ${TARGETS} --enable_bzlmod --noenable_workspace --lockfile_mode=error -- -@com_google_absl//absl/numeric:bits_test
    retry:
      automatic:
        - exit_status: -1  # Connection to the Agent was lost
          signal_reason: none
          limit: 2
        - signal_reason: agent_stop  # Agent was stopped by the OS (e.g. spot termination)
          limit: 2

  - label: "roborio bzlmod"
    commands:
      - tools/bazel shutdown; tools/bazel ${STARTUP} --output_base=../common_output_base build ${COMMON} --remote_download_outputs=minimal --config=roborio ${ROBORIO_TARGETS} --enable_bzlmod --noenable_workspace -- -@com_google_absl//absl/numeric:bits_test
    retry:
      automatic:
        - exit_status: -1  # Connection to the Agent was lost
          signal_reason: none
          limit: 2
        - signal_reason: agent_stop  # Agent was stopped by the OS (e.g. spot termination)
          limit: 2
